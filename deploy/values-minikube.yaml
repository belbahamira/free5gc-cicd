global:
  userPlaneArchitecture: single
  n2network:
    masterIf: eth0
  n3network:
    masterIf: eth0
  n4network:
    masterIf: eth0
  n6network:
    masterIf: eth0
  n9network:
    masterIf: eth0
free5gc-upf:
  securityContext:
    privileged: true
    capabilities:
      add:
        - NET_ADMIN
  upf:
    cfgFiles:
      upfcfg.yaml:
        configuration:
          pfcp:
            addr: "192.168.49.2"
          gtpu:
            addr: "192.168.49.2"
          dnnList:
            - dnn: internet
              cidr: 10.60.0.0/24
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi

