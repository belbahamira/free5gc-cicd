mongodb:
  image:
    registry: docker.io
    repository: bitnamilegacy/mongodb
    tag: "7.0"
  livenessProbe:
    enabled: false # Désactivé pour laisser MongoDB finir sa réparation sans être tué
  readinessProbe:
    enabled: false # Désactivé pour que les autres Pods puissent essayer de se connecter plus vite
  fullnameOverride: "mongodb"
  useStatefulSet: false # Garde-le à false pour Minikube si tu n'utilises pas de stockage persistant complexe
  auth:
    enabled: false
  persistence:
    enabled: true # Assure-toi que la persistance est bien activée
    size: 6Gi
    mountPath: /bitnami/mongodb/data/db/
  service:
    name: mongodb
    type: ClusterIP
    port: 27017
  resources:
    requests:
      cpu: 200m
      memory: 512Mi # Augmenté un peu pour aider la récupération des logs
    limits:
      cpu: 1000m
      memory: 1Gi
