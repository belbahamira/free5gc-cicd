apiVersion: v1
kind: ServiceAccount
metadata:
  name: upf-exporter
  namespace: free5gc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: upf-exporter
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: upf-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: upf-exporter
subjects:
- kind: ServiceAccount
  name: upf-exporter
  namespace: free5gc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upf-throughput-exporter
  namespace: free5gc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upf-throughput-exporter
  template:
    metadata:
      labels:
        app: upf-throughput-exporter
    spec:
      serviceAccountName: upf-exporter
      containers:
      - name: exporter
        image: upf-exporter:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: upf-throughput-exporter
  namespace: free5gc
  labels:
    app: upf-throughput-exporter
spec:
  selector:
    app: upf-throughput-exporter
  ports:
  - port: 8080
    targetPort: 8080
