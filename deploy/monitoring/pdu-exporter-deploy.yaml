apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdu-exporter-sa
  namespace: free5gc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pdu-exporter-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pdu-exporter-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pdu-exporter-role
subjects:
- kind: ServiceAccount
  name: pdu-exporter-sa
  namespace: free5gc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdu-session-exporter
  namespace: free5gc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdu-session-exporter
  template:
    metadata:
      labels:
        app: pdu-session-exporter
    spec:
      serviceAccountName: pdu-exporter-sa
      containers:
      - name: exporter
        image: pdu-exporter:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: pdu-session-exporter
  namespace: free5gc
  labels:
    app: pdu-session-exporter
spec:
  selector:
    app: pdu-session-exporter
  ports:
  - port: 8000
    targetPort: 8000
    name: metrics
