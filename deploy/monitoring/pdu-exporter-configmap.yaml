apiVersion: v1
data:
  exporter.py: |
    from prometheus_client import start_http_server, Gauge
    import requests, time

    pdu_sessions = Gauge("free5gc_pdu_sessions_total", "Total PDU sessions")

    def count_pdu_sessions():
        try:
            with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
                token = f.read()
            with open("/var/run/secrets/kubernetes.io/serviceaccount/namespace") as f:
                namespace = f.read().strip()
            headers = {"Authorization": "Bearer " + token}
            ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            url = "https://kubernetes.default.svc/api/v1/namespaces/" + namespace + "/pods?labelSelector=nf=smf"
            r = requests.get(url, headers=headers, verify=ca)
            pods = r.json().get("items", [])
            if not pods:
                print("SMF pod not found", flush=True)
                return 0
            total = 0
            for pod in pods:
                pod_name = pod["metadata"]["name"]
                log_url = "https://kubernetes.default.svc/api/v1/namespaces/" + namespace + "/pods/" + pod_name + "/log?container=smf"
                logs = requests.get(log_url, headers=headers, verify=ca).text
                established = logs.count("PFCP Session Establishment Accepted Response")
                released = logs.count("PFCP Session Deletion Response")
                active = max(0, established - released)
                print("Pod " + pod_name + ": " + str(active) + " active (est=" + str(established) + " rel=" + str(released) + ")", flush=True)
                total += active
            return total
        except Exception as e:
            print("Error: " + str(e), flush=True)
            return 0

    start_http_server(8080)
    print("Exporter started", flush=True)
    while True:
        count = count_pdu_sessions()
        pdu_sessions.set(count)
        print("PDU sessions active total: " + str(count), flush=True)
        time.sleep(15)
kind: ConfigMap
